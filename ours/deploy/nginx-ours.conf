# ours 需要的 nginx 片段（Ubuntu/Debian 的 sites-available/default 里）
#
# 1) /wb/：把 panel-ext.js 注入到面板 HTML 的 </body> 前。
#    必须配 proxy_set_header Accept-Encoding ""；上游给了 gzip 就没法做文本替换。
#    nginx 会自己 gzip 回给浏览器，实测 1.2MB 页面压到 436KB，不额外费流量。
# 2) /join/：朋友自助小站，独立进程 127.0.0.1:8790，剥掉 /join 前缀。

	location /wb/ {
		sub_filter '</body>' '<script src="/join/panel-ext.js" defer></script></body>';
		sub_filter_once on;
		proxy_set_header Accept-Encoding "";

		proxy_pass http://127.0.0.1:8788/;
		client_max_body_size 64m;
		proxy_request_buffering off;
		proxy_http_version 1.1;
		proxy_set_header Host 127.0.0.1:8788;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
		chunked_transfer_encoding on;
	}

	location /join/ {
		proxy_pass http://127.0.0.1:8790/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 120s;
	}
